<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON 格式化/校验 - 复刻版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .code-font { font-family: 'JetBrains Mono', monospace; }
        /* 隐藏滚动条但保留功能 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-[#f0f5ff] min-h-screen p-4 md:p-8">

<div class="max-w-7xl mx-auto bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
    <main class="p-6 relative">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

            <div class="flex flex-col">
                <div class="flex items-center justify-between mb-2">
                    <label class="text-sm font-semibold text-slate-700 italic">输入 (原始 JSON)</label>
                    <div class="flex items-center gap-3">
                        <span class="text-xs text-slate-400">字符数: 259</span>
                        <button class="text-xs text-blue-600 flex items-center gap-1"><i data-lucide="clipboard" class="w-3 h-3"></i> 粘贴</button>
                    </div>
                </div>
                <div class="flex-1 bg-slate-50 border border-slate-200 rounded-xl overflow-hidden min-h-[400px] flex">
                    <div class="w-10 bg-slate-100/50 border-r border-slate-200 text-right pr-2 py-3 text-xs text-slate-300 select-none code-font leading-6">
                        1<br>2<br>3<br>4<br>5<br>6<br>7<br>8<br>9<br>10
                    </div>
                    <div class="p-3 text-sm code-font leading-6 text-slate-600 w-full outline-none overflow-auto no-scrollbar" contenteditable="true">
                        {<br>
                        &nbsp;&nbsp;<span class="text-rose-500">"name"</span>: <span class="text-emerald-600">"Open Toolbox"</span>, <span class="text-rose-500">"version"</span>: <span class="text-emerald-600">"1.0.0"</span>...
                    </div>
                </div>
            </div>

            <div class="hidden lg:flex absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 z-10">
                <button class="w-8 h-8 bg-white border border-slate-200 rounded-full shadow-lg flex items-center justify-center text-blue-500 hover:bg-blue-50 transition-all">
                    <i data-lucide="chevron-right" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="flex flex-col">
                <div class="flex items-center justify-between mb-2">
                    <label class="text-sm font-semibold text-slate-700 italic">输出 (处理后 JSON)</label>
                    <div class="flex items-center gap-3">
                        <span class="text-xs text-slate-400">字符数: 259</span>
                        <button class="text-xs text-blue-600 flex items-center gap-1"><i data-lucide="copy" class="w-3 h-3"></i> 复制</button>
                    </div>
                </div>
                <div class="flex-1 bg-slate-50 border border-slate-200 rounded-xl overflow-hidden min-h-[400px] flex">
                    <div class="w-10 bg-slate-100/50 border-r border-slate-200 text-right pr-2 py-3 text-xs text-slate-300 select-none code-font leading-6">
                        1<br>2<br>3<br>4<br>5<br>6<br>7<br>8<br>9<br>10<br>11<br>12<br>13<br>14<br>15<br>16<br>17
                    </div>
                    <div class="p-3 text-sm code-font leading-6 w-full overflow-auto no-scrollbar">
                        <div class="text-slate-800">{</div>
                        <div class="pl-4"><span class="text-rose-500">"name"</span>: <span class="text-emerald-600">"Open Toolbox"</span>,</div>
                        <div class="pl-4"><span class="text-rose-500">"version"</span>: <span class="text-emerald-600">"1.0.0"</span>,</div>
                        <div class="pl-4 flex items-center gap-1">
                            <i data-lucide="chevron-down" class="w-3 h-3 text-slate-400"></i>
                            <span class="text-rose-500">"features"</span>: [
                        </div>
                        <div class="pl-8">{</div>
                        <div class="pl-12"><span class="text-rose-500">"name"</span>: <span class="text-emerald-600">"JSON 格式化"</span>,</div>
                        <div class="pl-12"><span class="text-rose-500">"enabled"</span>: <span class="text-blue-500 font-medium">true</span></div>
                        <div class="pl-8">},</div>
                        <div class="text-slate-800">}</div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="p-6 border-t border-slate-100 grid grid-cols-1 md:grid-cols-5 gap-8">
        <div class="md:col-span-1">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">校验结果</h3>
            <div class="flex items-start gap-3">
                <div class="mt-0.5 w-5 h-5 bg-emerald-100 rounded-full flex items-center justify-center">
                    <i data-lucide="check" class="w-3.5 h-3.5 text-emerald-600"></i>
                </div>
                <div>
                    <p class="text-sm font-bold text-slate-700">JSON 格式正确</p>
                    <p class="text-xs text-slate-400 mt-0.5">未发现语法错误</p>
                </div>
            </div>
        </div>
        <div class="md:col-span-2">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">工具选项</h3>
            <div class="flex flex-wrap gap-x-5 gap-y-3">
                <label class="flex items-center gap-2 cursor-pointer group">
                    <div class="w-4 h-4 border border-slate-300 rounded bg-blue-600 flex items-center justify-center text-white">
                        <i data-lucide="check" class="w-3 h-3"></i>
                    </div>
                    <span class="text-xs font-medium text-slate-600 group-hover:text-blue-600 transition-colors">自动格式化</span>
                </label>
                <label class="flex items-center gap-2 cursor-pointer group">
                    <div class="w-4 h-4 border border-slate-300 rounded bg-blue-600 flex items-center justify-center text-white">
                        <i data-lucide="check" class="w-3 h-3"></i>
                    </div>
                    <span class="text-xs font-medium text-slate-600 group-hover:text-blue-600 transition-colors">显示行号</span>
                </label>
                <label class="flex items-center gap-2 cursor-pointer group">
                    <div class="w-4 h-4 border border-slate-300 rounded bg-blue-600 flex items-center justify-center text-white">
                        <i data-lucide="check" class="w-3 h-3"></i>
                    </div>
                    <span class="text-xs font-medium text-slate-600 group-hover:text-blue-600 transition-colors">语法高亮</span>
                </label>
                <label class="flex items-center gap-2 cursor-pointer group">
                    <div class="w-4 h-4 border border-slate-300 rounded bg-white"></div>
                    <span class="text-xs font-medium text-slate-600 group-hover:text-blue-600 transition-colors">去除空格缩进</span>
                </label>
                <label class="flex items-center gap-2 cursor-pointer group">
                    <div class="w-4 h-4 border border-slate-300 rounded bg-white"></div>
                    <span class="text-xs font-medium text-slate-600 group-hover:text-blue-600 transition-colors">按键排序</span>
                </label>
            </div>
        </div>
        <div class="md:col-span-2">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">操作按钮</h3>
            <div class="flex flex-wrap gap-x-3 gap-y-3">
                <button class="text-xs font-medium text-white bg-blue-600 rounded-lg px-4 py-2">格式化</button>
                <button class="text-xs font-medium text-white bg-blue-600 rounded-lg px-4 py-2">压缩</button>
            </div>
        </div>
    </footer>

</div>

<script>
    // 初始化图标
    lucide.createIcons();
</script>
</body>
</html>
