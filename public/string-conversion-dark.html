<!DOCTYPE html>
<html class="dark" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>字符进制转换 - 在线工具</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0066ff",
                        "background": "#0a0a0b",
                        "surface": "#121214",
                        "surface-container": "#1c1c1f",
                        "on-surface": "#f1f1f1",
                        "on-surface-variant": "#a1a1aa",
                        "outline": "#3f3f46",
                        "outline-variant": "#27272a"
                    }
                },
            },
        }
    </script>
    <style>
        /* 使 html 和 body 占据整个视口高度，并移除溢出 */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0a0a0b; /* 背景颜色调整 */
        }
        body {
            color: #f1f1f1; /* 文字颜色调整 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .card {
            background: #121214; /* 卡片背景调整 */
            border: 1px solid #27272a; /* 卡片边框调整 */
            border-radius: 12px;
        }
        /* 容器占满 100% 高度并使用 flex 布局 */
        .full-page-container {
            height: 100%;
            display: flex;
            flex-direction: column;
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.5rem;
        }
        /* 针对 dark 模式下的下拉框优化 */
        select {
            background-color: #1c1c1f !important;
            color: #f1f1f1 !important;
            border-color: #27272a !important;
        }
    </style>
</head>
<body class="dark">

<div class="full-page-container">

    <div class="card p-6 mb-6 flex-grow flex flex-col justify-center">
        <div class="flex flex-col md:flex-row items-stretch gap-4 h-full">

            <div class="flex-1 flex flex-col">
                <label class="block text-sm font-bold text-on-surface mb-2">输入</label>
                <div class="relative flex-grow">
                    <textarea id="inputArea" class="w-full h-full p-4 bg-surface-container border border-outline-variant rounded-lg text-on-surface placeholder:text-on-surface-variant focus:ring-2 focus:ring-primary focus:outline-none resize-none text-sm" placeholder="请输入要转换的内容..."></textarea>
                    <span class="absolute bottom-2 right-3 text-xs text-on-surface-variant"><span id="charCount">0</span> / 10000</span>
                </div>
                <div class="grid grid-cols-2 gap-3 mt-4">
                    <div>
                        <label class="block text-xs text-on-surface-variant mb-1">输入编码</label>
                        <select class="w-full border border-outline-variant rounded-md p-2 text-sm">
                            <option>UTF-8</option>
                            <option>GBK</option>
                            <option>ASCII</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-on-surface-variant mb-1">输入格式</label>
                        <select class="w-full border border-outline-variant rounded-md p-2 text-sm">
                            <option>字符串</option>
                            <option>十六进制</option>
                            <option>Base64</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="flex items-center justify-center">
                <button class="bg-primary/10 text-primary w-10 h-10 rounded-full hover:bg-primary/20 transition-colors border border-primary/20">
                    <i class="fa-solid fa-right-left"></i>
                </button>
            </div>

            <div class="flex-1 flex flex-col">
                <label class="block text-sm font-bold text-on-surface mb-2">输出</label>
                <div class="flex-grow">
                    <textarea id="outputArea" class="w-full h-full p-4 border border-outline-variant rounded-lg bg-background text-on-surface-variant focus:outline-none resize-none text-sm" placeholder="转换结果将显示在这里..." readonly></textarea>
                </div>
                <div class="grid grid-cols-2 gap-3 mt-4">
                    <div>
                        <label class="block text-xs text-on-surface-variant mb-1">输出编码</label>
                        <select class="w-full border border-outline-variant rounded-md p-2 text-sm">
                            <option>UTF-8</option>
                            <option>GBK</option>
                            <option>ASCII</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-on-surface-variant mb-1">输出格式</label>
                        <select class="w-full border border-outline-variant rounded-md p-2 text-sm">
                            <option>字符串</option>
                            <option>十六进制</option>
                            <option>Base64</option>
                        </select>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div class="card bg-primary/5 p-3 flex items-center gap-4 text-[11px] text-on-surface-variant border border-primary/10 shrink-0">
        <div class="flex items-center gap-1">
            <i class="fa-solid fa-circle-info text-primary"></i>
            <span class="font-bold">支持的编码：</span> UTF-8, GBK, GK2312, ASCII, ISO-8859-1
        </div>
        <div class="flex items-center gap-1">
            <span class="font-bold ml-2">支持的格式：</span> 字符串, 十六进制, 十进制, 二进制, Base64, URL 编码
        </div>
    </div>
</div>

<script>
    const inputArea = document.getElementById('inputArea');
    const charCount = document.getElementById('charCount');
    const outputArea = document.getElementById('outputArea');

    inputArea.addEventListener('input', (e) => {
        const length = e.target.value.length;
        charCount.textContent = length;
        outputArea.value = e.target.value;
    });
</script>
</body>
</html>
