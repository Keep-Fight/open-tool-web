<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt 模板工具 - 纯净架构版</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* 品牌色与功能色 */
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --bg-page: #f8fafc;
            --bg-card: #ffffff;
            --bg-sidebar: #fcfdfe;

            /* 文字颜色 */
            --text-main: #1e293b;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;

            /* 边框与阴影 */
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);

            /* 间距与圆角 */
            --radius-lg: 12px;
            --radius-md: 8px;
            --radius-sm: 6px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            line-height: 1.5;
            padding: 20px;
        }

        /* --- 顶部面包屑/返回 --- */
        .top-back {
            display: flex;
            align-items: center;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 20px;
            cursor: pointer;
        }
        .top-back i { margin-right: 8px; }

        /* --- 头部区块 --- */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 24px;
        }
        .header-brand { display: flex; gap: 16px; }
        .app-icon {
            width: 52px; height: 52px;
            background: linear-gradient(135deg, #e0e7ff 0%, #f3e8ff 100%);
            color: #6366f1; border-radius: var(--radius-lg);
            display: flex; align-items: center; justify-content: center; font-size: 26px;
        }
        .header-title h1 { font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .tag-tool { background: #eff6ff; color: var(--primary); font-size: 11px; padding: 2px 8px; border-radius: 4px; }
        .header-desc { font-size: 14px; color: var(--text-secondary); margin: 6px 0 12px; }

        .header-tags { display: flex; gap: 12px; }
        .tag-pill { background: #f1f5f9; color: var(--text-secondary); padding: 4px 10px; border-radius: 20px; font-size: 12px; display: flex; align-items: center; gap: 5px; }

        .header-actions { display: flex; gap: 10px; }

        /* --- 通用按钮 --- */
        .btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 8px 16px; border-radius: var(--radius-md);
            font-size: 13px; border: 1px solid var(--border-color);
            background: #fff; cursor: pointer; transition: 0.2s;
        }
        .btn:hover { background: #f8fafc; border-color: var(--text-muted); }
        .btn-primary { background: var(--primary); color: #fff; border: none; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-danger { color: #ef4444; border-color: #fecaca; }

        /* --- 主三栏布局 --- */
        .workspace {
            display: grid;
            grid-template-columns: 220px 1fr 340px;
            gap: 24px;
            align-items: start;
        }

        .card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            padding: 20px;
        }
        .card-title { font-weight: 600; font-size: 15px; margin-bottom: 16px; display: flex; justify-content: space-between; }

        /* 左侧列表 */
        .menu-list { list-style: none; }
        .menu-item {
            padding: 10px 12px; border-radius: var(--radius-sm);
            color: var(--text-secondary); cursor: pointer; margin-bottom: 4px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .menu-item:hover { background: #f1f5f9; }
        .menu-item.active { background: #eff6ff; color: var(--primary); font-weight: 500; }

        /* 中间编辑区 */
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
        .field { display: flex; flex-direction: column; gap: 8px; }
        .field label { font-size: 13px; color: var(--text-secondary); font-weight: 500; }
        input, select, textarea {
            width: 100%; padding: 10px; border: 1px solid var(--border-color);
            border-radius: var(--radius-sm); font-size: 14px; outline: none;
        }
        input:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 2px #dbeafe; }

        /* 代码编辑器模拟 */
        .editor-container {
            border: 1px solid var(--border-color); border-radius: var(--radius-sm);
            overflow: hidden; margin-top: 10px; display: flex;
        }
        .line-numbers {
            background: #f8fafc; border-right: 1px solid var(--border-color);
            padding: 12px 8px; text-align: right; color: #cbd5e1;
            font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.6; min-width: 35px;
        }
        .editor-main {
            flex: 1; padding: 12px; border: none; resize: vertical;
            min-height: 260px; font-family: 'Courier New', monospace; font-size: 14px; line-height: 1.6;
        }

        /* 变量设置表格 */
        .var-settings { width: 100%; border-collapse: collapse; margin-top: 12px; }
        .var-settings th { text-align: left; background: #f8fafc; padding: 10px; font-size: 12px; color: var(--text-secondary); }
        .var-settings td { padding: 8px 10px; border-bottom: 1px solid var(--border-color); }

        /* 右侧预览区 */
        .preview-area {
            background: #fafafa; border: 1px solid var(--border-color);
            border-radius: var(--radius-sm); padding: 16px; min-height: 300px;
            color: var(--text-muted); font-size: 13px; margin-top: 10px;
        }

        /* 底部信息提示 */
        .info-tip {
            margin-top: 24px; background: #eff6ff; color: var(--primary);
            padding: 12px 16px; border-radius: var(--radius-md); font-size: 13px;
            display: flex; align-items: center; gap: 8px;
        }

    </style>
</head>
<body>

<div class="top-back">
    <i class="fa-solid fa-chevron-left"></i> 返回工具箱
</div>

<header class="page-header">
    <div class="header-brand">
        <div class="app-icon"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
        <div class="header-title">
            <h1>Prompt 模板工具 <span class="tag-tool">实用工具</span></h1>
            <p class="header-desc">管理、创建和使用 Prompt 模板，提升 AI 对话效率。</p>
            <div class="header-tags">
                <span class="tag-pill"><i class="fa-regular fa-circle-check"></i> AI 对话</span>
                <span class="tag-pill"><i class="fa-regular fa-circle-check"></i> 内容创作</span>
                <span class="tag-pill"><i class="fa-regular fa-circle-check"></i> 编程开发</span>
            </div>
        </div>
    </div>
    <div class="header-actions">
        <button class="btn"><i class="fa-regular fa-star"></i> 收藏</button>
        <button class="btn"><i class="fa-solid fa-share-nodes"></i> 分享</button>
    </div>
</header>

<main class="workspace">

    <aside class="card">
        <div class="card-title">我的模板 <span style="color: var(--primary); font-size: 12px; cursor: pointer;">+ 新建模板</span></div>
        <ul class="menu-list">
            <li class="menu-item active">代码解释助手</li>
            <li class="menu-item">翻译助手</li>
            <li class="menu-item">周报生成器</li>
            <li class="menu-item">小红书文案生成</li>
            <li class="menu-item">SQL 优化助手</li>
            <li class="menu-item">面试题生成器</li>
            <li class="menu-item">文章润色助手</li>
            <li class="menu-item">学习计划制定</li>
        </ul>
    </aside>

    <section class="card">
        <div class="card-title">模板编辑</div>

        <div class="form-row">
            <div class="field">
                <label>模板名称</label>
                <input type="text" placeholder="输入模板名称...">
            </div>
            <div class="field">
                <label>所属分类</label>
                <select>
                    <option>编程开发</option>
                    <option>内容创作</option>
                    <option>日常办公</option>
                </select>
            </div>
        </div>

        <div class="field" style="margin-bottom: 20px;">
            <label>模板描述 (可选)</label>
            <textarea rows="2" placeholder="用于描述该模板的使用场景和功能..."></textarea>
        </div>

        <div class="field">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <label>模板内容</label>
                <span style="color: var(--primary); font-size: 12px; cursor: pointer;">插入变量 ></span>
            </div>
            <div class="editor-container">
                <div class="line-numbers">1<br>2<br>3<br>4<br>5<br>6<br>7<br>8<br>9<br>10</div>
                <textarea class="editor-main" placeholder="在此输入 Prompt 模板内容..."></textarea>
            </div>
        </div>

        <div class="card-title" style="margin-top: 24px; font-size: 14px;">变量设置</div>
        <table class="var-settings">
            <thead>
            <tr>
                <th>变量名</th>
                <th>变量值 (文本)</th>
                <th width="40"></th>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td><input type="text" value="language" style="border:none; padding:4px; background:transparent;"></td>
                <td><input type="text" placeholder="请输入变量值说明..." style="border:none; padding:4px; background:transparent;"></td>
                <td style="text-align: center;"><i class="fa-regular fa-trash-can" style="color:var(--text-muted); cursor:pointer;"></i></td>
            </tr>
            <tr>
                <td><input type="text" value="code" style="border:none; padding:4px; background:transparent;"></td>
                <td><input type="text" placeholder="请输入变量值说明..." style="border:none; padding:4px; background:transparent;"></td>
                <td style="text-align: center;"><i class="fa-regular fa-trash-can" style="color:var(--text-muted); cursor:pointer;"></i></td>
            </tr>
            </tbody>
        </table>
        <button class="btn" style="margin-top: 12px; width: 100%; border-style: dashed; justify-content: center; color: var(--primary);">+ 添加变量</button>

        <div style="display: flex; gap: 12px; margin-top: 24px;">
            <button class="btn btn-primary" style="flex: 2; justify-content: center;"><i class="fa-solid fa-floppy-disk"></i> 保存模板</button>
            <button class="btn" style="flex: 1; justify-content: center;"><i class="fa-regular fa-eye"></i> 预览效果</button>
            <button class="btn btn-danger" style="flex: 1; justify-content: center;"><i class="fa-regular fa-trash-can"></i> 删除模板</button>
        </div>
    </section>

    <aside class="card">
        <div class="card-title">模板预览 <button class="btn-primary btn" style="font-size: 12px; padding: 4px 8px;">使用模板</button></div>
        <div class="field" style="margin-bottom: 16px;">
            <label>预览输入 (language)</label>
            <input type="text" placeholder="输入变量值...">
        </div>
        <div class="field">
            <label>预览输入 (code)</label>
            <textarea rows="4" placeholder="输入变量内容..."></textarea>
        </div>
        <div style="margin-top: 20px;">
            <label style="font-size: 12px; color: var(--text-muted);">生成结果预览</label>
            <div class="preview-area">
                预览结果将实时显示在这里...
            </div>
        </div>
    </aside>

</main>

<div class="info-tip">
    <i class="fa-solid fa-circle-info"></i>
    提示：在模板内容中使用 {变量名} 语法插入变量。点击右侧“使用模板”可快速将填充后的内容复制到剪贴板。
</div>

</body>
</html>
