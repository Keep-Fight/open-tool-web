<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二维码生成工具界面还原</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#f8fafc] p-6 text-[#334155]">

<div class="max-w-6xl mx-auto space-y-6">

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

        <div class="bg-white rounded-xl border border-gray-100 p-6 shadow-sm">
            <h2 class="text-lg font-bold mb-6">输入内容</h2>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-500 mb-2">内容类型</label>
                    <div class="relative">
                        <select class="w-full bg-[#fcfdfe] border border-gray-200 rounded-lg px-4 py-2.5 appearance-none focus:outline-none focus:ring-2 focus:ring-blue-500/20">
                            <option>文本</option>
                        </select>
                        <i data-lucide="chevron-down" class="absolute right-3 top-3 w-4 h-4 text-gray-400"></i>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-500 mb-2">内容</label>
                    <div class="relative">
                        <textarea class="w-full bg-[#fcfdfe] border border-gray-200 rounded-lg px-4 py-3 h-64 focus:outline-none focus:ring-2 focus:ring-blue-500/20 resize-none text-gray-700">https://toolbox.example.com</textarea>
                        <span class="absolute bottom-3 right-4 text-xs text-gray-400">27 / 2000</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-xl border border-gray-100 p-6 shadow-sm flex flex-col">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-lg font-bold">二维码预览</h2>
                <div class="flex space-x-4">
                    <button class="flex items-center text-sm text-blue-500 hover:text-blue-600">
                        <i data-lucide="trash-2" class="w-4 h-4 mr-1"></i> 清空
                    </button>
                    <button class="flex items-center text-sm text-blue-500 hover:text-blue-600">
                        <i data-lucide="refresh-cw" class="w-4 h-4 mr-1"></i> 刷新
                    </button>
                </div>
            </div>

            <div class="flex-grow flex items-center justify-center py-8">
                <div class="p-4 border border-gray-50 rounded-xl shadow-inner bg-white">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://toolbox.example.com" alt="QR Code" class="w-48 h-48">
                </div>
            </div>

            <div class="mt-4 p-4 bg-[#f8fafc] rounded-lg border border-gray-100 flex justify-between items-center group">
                <div class="flex items-center text-sm text-gray-500 truncate mr-4">
                    <i data-lucide="link" class="w-4 h-4 mr-2 flex-shrink-0"></i>
                    <span class="truncate">https://toolbox.example.com</span>
                </div>
                <button class="text-gray-400 hover:text-blue-500">
                    <i data-lucide="copy" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
    </div>

    <div class="bg-white rounded-xl border border-gray-100 p-6 shadow-sm">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-lg font-bold">样式设置</h2>
            <label class="flex items-center text-sm text-gray-600 cursor-pointer">
                <input type="checkbox" class="mr-2 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                圆角样式
            </label>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-6">
            <div class="space-y-2">
                <label class="text-xs text-gray-500 font-medium">纠错等级</label>
                <select class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm bg-white focus:outline-none">
                    <option>M (适中)</option>
                </select>
            </div>
            <div class="space-y-2">
                <label class="text-xs text-gray-500 font-medium">尺寸大小</label>
                <select class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm bg-white focus:outline-none">
                    <option>300 x 300</option>
                </select>
            </div>
            <div class="space-y-2">
                <label class="text-xs text-gray-500 font-medium">前景色</label>
                <div class="flex items-center border border-gray-200 rounded-lg px-3 py-2 space-x-2">
                    <div class="w-4 h-4 rounded bg-black"></div>
                    <span class="text-sm">#000000</span>
                </div>
            </div>
            <div class="space-y-2">
                <label class="text-xs text-gray-500 font-medium">背景色</label>
                <div class="flex items-center border border-gray-200 rounded-lg px-3 py-2 space-x-2">
                    <div class="w-4 h-4 rounded border border-gray-200 bg-white"></div>
                    <span class="text-sm">#FFFFFF</span>
                </div>
            </div>
            <div class="space-y-2">
                <label class="text-xs text-gray-500 font-medium">边距</label>
                <select class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm bg-white focus:outline-none">
                    <option>中 (16px)</option>
                </select>
            </div>
            <div class="space-y-2">
                <label class="text-xs text-gray-500 font-medium">Logo (可选)</label>
                <div class="w-full border border-dashed border-gray-300 rounded-lg py-2 flex items-center justify-center text-sm text-gray-400 cursor-pointer hover:border-blue-400 hover:bg-blue-50/30">
                    <i data-lucide="upload" class="w-4 h-4 mr-2"></i> 上传 Logo
                </div>
            </div>
        </div>
    </div>

    <div class="bg-white rounded-xl border border-gray-100 p-6 shadow-sm">
        <h2 class="text-lg font-bold mb-6">下载二维码</h2>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <button class="flex items-center justify-center bg-[#3b82f6] text-white py-2.5 rounded-lg hover:bg-blue-600 transition-colors shadow-sm shadow-blue-200">
                <i data-lucide="download" class="w-4 h-4 mr-2"></i> 下载 PNG
            </button>
            <button class="flex items-center justify-center border border-gray-200 py-2.5 rounded-lg hover:bg-gray-50 transition-colors">
                <i data-lucide="download" class="w-4 h-4 mr-2"></i> 下载 JPG
            </button>
            <button class="flex items-center justify-center border border-gray-200 py-2.5 rounded-lg hover:bg-gray-50 transition-colors">
                <i data-lucide="code" class="w-4 h-4 mr-2"></i> 下载 SVG
            </button>
            <button class="flex items-center justify-center border border-gray-200 py-2.5 rounded-lg hover:bg-gray-50 transition-colors">
                <i data-lucide="copy" class="w-4 h-4 mr-2"></i> 复制二维码
            </button>
        </div>

        <div class="mt-6 flex items-start space-x-2 text-sm text-blue-500/80 bg-blue-50/30 p-3 rounded-lg border border-blue-50">
            <i data-lucide="info" class="w-4 h-4 mt-0.5"></i>
            <p>提示：建议使用 PNG 格式以获得最佳效果，二维码可用于网站、文档、名片、海报等多种场景。</p>
        </div>
    </div>

</div>

<script>
    // 初始化图标
    lucide.createIcons();
</script>
</body>
</html>
